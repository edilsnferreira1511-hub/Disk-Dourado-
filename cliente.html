<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#141210">
<title>Disk Dourado — Faça seu pedido</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#141210; --card:#1F1B16; --card-soft: rgba(31,27,22,.6);
  --primary:#C9A227; --secondary:#E8C874;
  --glow: rgba(201,162,39,.25); --glow-strong: rgba(201,162,39,.4);
  --text:#F3E9D2; --text-dim:#A9946A;
  --green:#39E58C; --danger:#FF5C7A;
  --glass: rgba(201,162,39,.06); --glass-border: rgba(201,162,39,.22);
  --r-lg:28px; --r-md:22px; --r-sm:16px;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html{ -webkit-font-smoothing:antialiased; }
body{
  margin:0; font-family:'Poppins',system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh; position:relative; overflow-x:hidden;
}
::selection{ background:var(--primary); color:#fff; }
::-webkit-scrollbar{ display:none; }

/* ===== Fundo atmosférico ===== */
.bg-fixed{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
.bg-fixed::before{
  content:''; position:absolute; inset:-20%;
  background:
    radial-gradient(38% 30% at 82% 6%, rgba(201,162,39,.22), transparent 60%),
    radial-gradient(45% 35% at 8% 18%, rgba(201,162,39,.16), transparent 60%),
    radial-gradient(50% 40% at 50% 100%, rgba(140,109,31,.18), transparent 60%),
    var(--bg);
}
.orb{ position:absolute; border-radius:50%; filter:blur(60px); opacity:.35; animation:float 9s ease-in-out infinite; }
.orb1{ width:240px; height:240px; background:var(--primary); top:-60px; right:-60px; animation-delay:0s; }
.orb2{ width:200px; height:200px; background:#8C6D1F; bottom:120px; left:-70px; animation-delay:2s; }
.promo-banner{
  display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:var(--r-md); margin-bottom:16px;
  background:linear-gradient(135deg, rgba(201,162,39,.16), rgba(201,162,39,.04));
  border:1px solid var(--glass-border);
}
.promo-banner .ico{ font-size:1.5rem; }
.promo-banner .txt strong{ display:block; font-size:.85rem; color:var(--secondary); letter-spacing:.2px; }
.promo-banner .txt span{ font-size:.7rem; color:var(--text-dim); }

/* ===== Saudação personalizada ===== */
.greeting-card{
  padding:14px 18px; border-radius:var(--r-lg); margin-bottom:14px;
  background:var(--glass); backdrop-filter:blur(10px); border:1px solid var(--glass-border);
}
.greeting-hello{ font-weight:800; font-size:1.05rem; }
.greeting-sub{ color:var(--text-dim); font-size:.78rem; margin-top:2px; margin-bottom:10px; }
.last-order-toggle{
  display:flex; align-items:center; justify-content:space-between; cursor:pointer;
  font-size:.76rem; font-weight:700; color:var(--secondary); padding:2px 0;
}
.last-order-toggle .chevron{ transition:transform .2s ease; color:var(--text-dim); }
.last-order-toggle .chevron.open{ transform:rotate(180deg); }
.greeting-label{ font-size:.62rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim); margin-bottom:7px; }
.greeting-chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; margin-bottom:12px; }
.greeting-chip{
  font-size:.72rem; font-weight:600; padding:5px 11px; border-radius:999px;
  background:rgba(201,162,39,.12); border:1px solid rgba(201,162,39,.3); color:var(--secondary);
}
.greeting-btn{
  width:100%; border:none; cursor:pointer; background:var(--primary); color:#141210; font-weight:700;
  padding:11px; border-radius:999px; font-size:.8rem;
}

/* ===== Destaques ===== */
.destaques-wrap{ margin-bottom:6px; }
.destaque-group{ margin-bottom:16px; }
.destaque-title{ font-weight:800; font-size:.85rem; margin-bottom:8px; padding-left:2px; }
.destaque-row{ display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
.destaque-row::-webkit-scrollbar{ display:none; }
.destaque-card{
  flex-shrink:0; width:118px; cursor:pointer; background:var(--card); border:1px solid var(--glass-border);
  border-radius:var(--r-md); overflow:hidden; transition:transform .15s cubic-bezier(.22,.9,.32,1);
}
.destaque-card:active{ transform:scale(.95); }
.destaque-card.sem-estoque{ opacity:.5; }
.destaque-media{
  height:90px; width:100%; background:radial-gradient(circle, #2b241a, #201a13);
  display:flex; align-items:center; justify-content:center; font-size:1.8rem;
}
.destaque-media img{ width:100%; height:100%; object-fit:contain; padding:8px; }
.destaque-nome{ font-size:.72rem; font-weight:700; padding:8px 8px 2px; line-height:1.25; }
.destaque-preco{ font-size:.72rem; font-weight:800; color:var(--secondary); padding:0 8px 8px; }

.orb3{ width:160px; height:160px; background:var(--secondary); top:45%; right:-40px; animation-delay:4s; }
@keyframes float{ 0%,100%{ transform:translateY(0) scale(1); } 50%{ transform:translateY(-18px) scale(1.06); } }

.app{ max-width:480px; margin:0 auto; padding:18px 16px 130px; min-height:100vh; position:relative; z-index:2; }

/* ===== Utilitários de animação ===== */
@keyframes fadeSlideUp{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:translateY(0); } }
@keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
@keyframes popIn{ from{ opacity:0; transform:scale(.7); } to{ opacity:1; transform:scale(1); } }
@keyframes glowPulse{ 0%,100%{ box-shadow:0 0 0 rgba(201,162,39,0); } 50%{ box-shadow:0 0 32px var(--glow); } }
.anim-in{ animation:fadeSlideUp .45s cubic-bezier(.22,.9,.32,1) both; }
.ripple{ position:relative; overflow:hidden; }
.ripple-fx{ position:absolute; border-radius:50%; background:rgba(255,255,255,.35); transform:scale(0); animation:rippleAnim .55s ease-out forwards; pointer-events:none; }
@keyframes rippleAnim{ to{ transform:scale(3); opacity:0; } }

/* ===== Header ===== */
.topbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
.topbar-left{ display:flex; align-items:center; gap:12px; min-width:0; }
.topbar .logo{
  width:48px; height:48px; border-radius:16px; flex-shrink:0; object-fit:cover;
  border:1px solid var(--glass-border); box-shadow:0 6px 18px rgba(0,0,0,.4), 0 0 0 3px rgba(201,162,39,.15);
}
.topbar .id h1{ margin:0; font-size:1.02rem; font-weight:800; letter-spacing:.2px; }
.topbar .id p{ margin:2px 0 0; font-size:.7rem; color:var(--text-dim); font-weight:500; }
.topbar .bell{
  margin-left:auto; width:42px; height:42px; border-radius:14px; display:flex; align-items:center; justify-content:center;
  background:var(--glass); border:1px solid var(--glass-border); backdrop-filter:blur(10px); font-size:1.1rem;
}
.taxa-zero-badge{
  flex-shrink:0; font-size:.66rem; font-weight:700; color:var(--secondary); white-space:nowrap;
  background:rgba(201,162,39,.14); border:1px solid rgba(201,162,39,.32); border-radius:999px; padding:7px 12px;
}

.search-bar-sticky{
  position:sticky; top:0; z-index:15; margin:0 -16px 18px; padding:10px 16px 6px;
  background:linear-gradient(var(--bg) 78%, transparent);
}
.search-bar{
  display:flex; align-items:center; gap:10px; background:var(--glass); border:1px solid var(--glass-border);
  backdrop-filter:blur(14px); border-radius:999px; padding:13px 18px;
}
.search-bar svg{ flex-shrink:0; opacity:.6; }
.search-bar input{
  border:none; background:transparent; outline:none; color:#fff; font-family:inherit; font-size:.85rem; width:100%; font-weight:500;
}
.search-bar input::placeholder{ color:var(--text-dim); }

/* ===== Título de seção ===== */
.section-title{ font-size:1.35rem; font-weight:800; letter-spacing:-.3px; margin:6px 2px 4px; }
.section-sub{ color:var(--text-dim); font-size:.78rem; margin:0 2px 16px; font-weight:500; }
.eyebrow{ color:var(--secondary); font-size:.68rem; font-weight:700; letter-spacing:1.6px; text-transform:uppercase; margin:0 2px 4px; }

/* ===== Categorias (pill nav) ===== */
.cat-row{ display:flex; gap:8px; overflow-x:auto; margin-bottom:18px; padding-bottom:2px; scrollbar-width:none; }
.cat-pill{
  flex-shrink:0; border:1px solid var(--glass-border); background:var(--glass); backdrop-filter:blur(10px);
  color:var(--text-dim); font-weight:700; font-size:.8rem; padding:11px 18px; border-radius:999px; cursor:pointer;
  display:flex; align-items:center; gap:6px; transition:all .25s cubic-bezier(.22,.9,.32,1);
}
.cat-pill.active{
  background:var(--primary); color:#141210; border-color:transparent;
  box-shadow:0 8px 22px rgba(201,162,39,.4);
}

/* ===== Card de produto grande ===== */
.product-card{
  position:relative; border-radius:var(--r-lg); overflow:hidden; margin-bottom:16px; cursor:pointer;
  background:var(--card); border:1px solid var(--glass-border);
  box-shadow:0 16px 36px rgba(0,0,0,.45);
  transition:transform .18s cubic-bezier(.22,.9,.32,1);
}
.product-card:active{ transform:scale(.97); }
.product-card .media{
  position:relative; height:210px; width:100%; overflow:hidden;
  background:radial-gradient(circle, #2b241a, #201a13);
  display:flex; align-items:center; justify-content:center; font-size:2.6rem;
}
.product-card .media img{
  width:100%; height:100%; object-fit:contain; padding:14px;
  transition:transform .35s cubic-bezier(.22,.9,.32,1);
}
.product-card:active .media img{ transform:scale(1.06); }
.product-card .media::after{
  content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(20,18,16,0) 55%, rgba(20,18,16,.88) 100%);
}
.badge-fast{
  position:absolute; top:12px; left:12px; z-index:2; background:rgba(15,6,26,.55); backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.15); color:#fff; font-size:.62rem; font-weight:700; padding:6px 11px;
  border-radius:999px; display:flex; align-items:center; gap:4px;
}
.qty-float{
  position:absolute; top:10px; right:10px; z-index:2; background:var(--green); color:#052b16; font-weight:900;
  font-size:.7rem; padding:4px 10px; border-radius:999px; box-shadow:0 4px 14px rgba(57,229,140,.5); animation:popIn .25s ease;
}
.product-card .body{ padding:14px 16px 16px; }
.product-card .nome{ font-weight:800; font-size:.95rem; margin-bottom:3px; }
.product-card .desc{ color:var(--text-dim); font-size:.72rem; line-height:1.4; margin-bottom:10px; }
.product-card .foot{ display:flex; align-items:center; justify-content:space-between; }
.product-card .preco{ font-weight:800; font-size:1.05rem; color:var(--secondary); }
.product-card .add-btn{
  border:none; cursor:pointer; background:var(--primary); color:#141210; font-weight:700;
  font-size:.76rem; padding:9px 16px; border-radius:999px; box-shadow:0 6px 16px rgba(201,162,39,.4);
  transition:transform .15s cubic-bezier(.22,.9,.32,1);
}
.product-card .add-btn:disabled{ background:#3a352a; color:var(--text-dim); box-shadow:none; cursor:not-allowed; }
.product-card .add-btn.bump{ animation:btnBump .32s cubic-bezier(.22,.9,.32,1); }
@keyframes btnBump{ 0%{ transform:scale(1); } 40%{ transform:scale(.82); } 100%{ transform:scale(1); } }
.product-card.sem-estoque{ opacity:.55; }
.product-card.sem-estoque .media{ filter:grayscale(1); }

/* ===== Detalhe do produto ===== */
.pd-overlay{
  position:fixed; inset:0; z-index:60; background:rgba(10,8,5,.72); backdrop-filter:blur(4px);
  display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity .25s ease;
}
.pd-overlay.open{ opacity:1; pointer-events:all; }
.pd-sheet{
  width:100%; max-width:480px; max-height:88vh; overflow-y:auto; background:var(--bg);
  border-radius:26px 26px 0 0; border:1px solid var(--glass-border); border-bottom:none;
  transform:translateY(100%); transition:transform .3s cubic-bezier(.22,.9,.32,1);
  box-shadow:0 -20px 50px rgba(0,0,0,.5);
}
.pd-overlay.open .pd-sheet{ transform:translateY(0); }
.pd-media{
  position:relative; height:260px; width:100%; background:radial-gradient(circle, #2b241a, #201a13);
  display:flex; align-items:center; justify-content:center; font-size:4rem;
}
.pd-media img{ width:100%; height:100%; object-fit:contain; padding:24px; }
.pd-close{
  position:absolute; top:14px; right:14px; width:34px; height:34px; border-radius:50%; border:none; cursor:pointer;
  background:rgba(20,18,16,.6); backdrop-filter:blur(6px); color:#fff; font-size:1.1rem; display:flex; align-items:center; justify-content:center;
}
.pd-body{ padding:22px 20px 24px; }
.pd-nome{ font-weight:800; font-size:1.25rem; margin-bottom:4px; }
.pd-preco{ font-weight:800; font-size:1.15rem; color:var(--secondary); margin-bottom:14px; }
.pd-desc{ color:var(--text-dim); font-size:.85rem; line-height:1.6; margin-bottom:18px; }
.pd-field-label{ font-size:.68rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-dim); margin-bottom:6px; }
.pd-obs{
  width:100%; background:var(--card); border:1.5px solid var(--glass-border); border-radius:var(--r-md);
  padding:12px 14px; color:var(--text); font-size:.85rem; font-family:inherit; resize:none; margin-bottom:18px;
}
.pd-obs:focus{ outline:none; border-color:var(--primary); }
.pd-footer{ display:flex; align-items:center; gap:12px; }
.pd-footer .qty-stepper{ flex-shrink:0; }
.pd-add-btn{
  flex:1; border:none; cursor:pointer; background:var(--primary); color:#141210; font-weight:800;
  padding:14px; border-radius:999px; font-size:.9rem;
}
.pd-add-btn:disabled{ background:#3a352a; color:var(--text-dim); }

/* ===== Barra de progresso do checkout ===== */
.progress-shell{ margin-bottom:20px; }
.progress-track{ height:6px; border-radius:999px; background:rgba(255,255,255,.08); overflow:hidden; margin-bottom:8px; }
.progress-fill{ height:100%; border-radius:999px; background:linear-gradient(90deg,var(--primary),var(--secondary)); box-shadow:0 0 14px var(--glow-strong); transition:width .4s cubic-bezier(.22,.9,.32,1); }
.progress-label{ display:flex; justify-content:space-between; font-size:.66rem; color:var(--text-dim); font-weight:600; text-transform:uppercase; letter-spacing:.6px; }

.back-link{ color:var(--text-dim); font-size:.78rem; margin-bottom:14px; cursor:pointer; display:flex; align-items:center; gap:6px; font-weight:600; }

/* ===== Card vidro (glassmorphism) ===== */
.glass-card{
  background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02)), var(--card-soft);
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  border:1px solid var(--glass-border); border-radius:var(--r-lg); padding:24px 20px;
  box-shadow:0 20px 44px rgba(0,0,0,.45);
}
.step-title{ font-size:1.28rem; font-weight:800; margin-bottom:4px; letter-spacing:-.3px; }
.step-sub{ color:var(--text-dim); font-size:.8rem; margin-bottom:20px; line-height:1.5; font-weight:500; }
.field-label{ color:var(--text-dim); font-size:.68rem; margin-bottom:8px; margin-left:4px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; }

.pill-input{
  width:100%; background:rgba(255,255,255,.06); border:1px solid var(--glass-border); outline:none;
  color:#fff; font-weight:600; font-family:inherit; padding:16px 20px; border-radius:999px; font-size:.9rem; margin-bottom:16px;
  transition:border-color .2s, box-shadow .2s;
}
.pill-input:focus{ border-color:var(--primary); box-shadow:0 0 0 4px var(--glow); }
.pill-input::placeholder{ color:var(--text-dim); }
textarea.pill-input{ border-radius:18px; resize:vertical; min-height:60px; }
.hint{ color:var(--text-dim); font-size:.66rem; margin:-10px 6px 16px; }

.btn-primary{
  border:none; cursor:pointer; padding:17px; border-radius:999px;
  background:var(--primary);
  color:#141210; font-weight:800; font-size:.92rem; width:100%; font-family:inherit;
  box-shadow:0 12px 28px rgba(201,162,39,.4); transition:all .18s cubic-bezier(.22,.9,.32,1);
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.btn-primary:disabled{ opacity:.35; box-shadow:none; cursor:not-allowed; }
.btn-primary:active:not(:disabled){ transform:scale(.97); }

/* ===== Barra do carrinho ===== */
.cart-bar{
  position:fixed; left:16px; right:16px; bottom:16px; max-width:448px; margin:0 auto;
  background:rgba(201,162,39,.85); backdrop-filter:blur(14px); color:#141210; border-radius:999px; padding:12px 20px;
  display:flex; justify-content:center; align-items:center; gap:8px; font-weight:800; cursor:pointer; z-index:20;
  box-shadow:0 12px 28px rgba(201,162,39,.4); border:1px solid rgba(255,255,255,.25);
  animation:fadeSlideUp .35s ease; font-size:.85rem;
}
.cart-bar .left{ display:flex; align-items:center; gap:6px; }
.cart-bar .count-dot{ background:rgba(20,18,16,.14); border-radius:999px; padding:2px 8px; font-size:.78rem; }
.cart-bar .sep{ opacity:.55; }
.cart-bar.disabled{ opacity:0; pointer-events:none; transform:translateY(20px); }
.cart-bar.bump{ animation:cartBump .38s cubic-bezier(.22,.9,.32,1); }
@keyframes cartBump{
  0%{ transform:scale(1) rotate(0); } 25%{ transform:scale(1.05) rotate(-1deg); }
  50%{ transform:scale(.98) rotate(1deg); } 75%{ transform:scale(1.03) rotate(-.5deg); } 100%{ transform:scale(1) rotate(0); }
}

/* ===== Carrinho (página) ===== */
.cart-item{
  display:flex; justify-content:space-between; align-items:center; background:var(--card); border:1px solid var(--glass-border);
  border-radius:var(--r-md); padding:12px 16px; margin-bottom:10px; animation:fadeSlideUp .3s ease both; gap:12px;
}
.cart-item-media{
  width:48px; height:48px; border-radius:10px; overflow:hidden; flex-shrink:0;
  background:radial-gradient(circle, #2b241a, #201a13); display:flex; align-items:center; justify-content:center; font-size:1.3rem;
}
.cart-item-media img{ width:100%; height:100%; object-fit:contain; padding:4px; }
.cart-item .info{ flex:1; min-width:0; }
.cart-item .nome{ font-weight:700; font-size:.85rem; margin-bottom:2px; }
.cart-item .unit{ color:var(--text-dim); font-size:.68rem; }
.cart-item .right{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; margin-left:10px; }
.cart-item .preco{ font-weight:800; color:var(--secondary); font-size:.88rem; }
.qty-stepper{ display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.06); border-radius:999px; padding:4px; }
.qty-stepper button{
  width:24px; height:24px; border-radius:50%; border:none; cursor:pointer; font-weight:800; font-size:.85rem;
  background:rgba(255,255,255,.12); color:#fff; display:flex; align-items:center; justify-content:center;
}
.qty-stepper button.danger{ background:var(--danger); }
.qty-stepper span{ font-weight:700; font-size:.78rem; min-width:14px; text-align:center; }

.total-row{ display:flex; justify-content:space-between; align-items:center; font-size:1.15rem; font-weight:800; margin:16px 0; padding-top:16px; border-top:1px dashed rgba(255,255,255,.15); }
.total-row .amt{ color:var(--secondary); font-size:1.35rem; }

.pay-row{ display:flex; gap:8px; margin-bottom:20px; }
.pay-chip{
  flex:1; border:1.5px solid var(--glass-border); padding:16px 6px; border-radius:18px; background:var(--card);
  color:var(--text-dim); font-weight:700; font-size:.78rem; cursor:pointer; text-align:center; transition:all .2s;
}
.pay-chip .ico{ font-size:1.3rem; display:block; margin-bottom:6px; }
.pay-chip.active{
  background:linear-gradient(160deg, rgba(201,162,39,.22), rgba(201,162,39,.08)); color:#fff; border-color:var(--primary);
  box-shadow:0 0 0 1px var(--primary);
}

/* ===== Confirmação ===== */
.confirm-wrap{ min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
.confirm-icon-wrap{ position:relative; width:110px; height:110px; margin-bottom:18px; }
.confirm-icon-wrap .ring{ position:absolute; inset:0; border-radius:50%; background:var(--glass); border:1px solid var(--glass-border); animation:glowPulse 2.4s ease-in-out infinite; }
.confirm-icon-wrap .check{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:2.6rem;
  background:var(--primary); border-radius:50%; animation:popIn .4s cubic-bezier(.22,.9,.32,1);
  box-shadow:0 14px 34px rgba(201,162,39,.5);
}
.confirm-wrap h2{ margin:6px 0 8px; font-size:1.3rem; font-weight:800; }
.confirm-wrap p{ color:var(--text-dim); font-size:.85rem; line-height:1.6; max-width:320px; }
.status-badge{
  background:rgba(201,162,39,.14); color:var(--secondary); border:1px solid var(--primary); padding:9px 20px;
  border-radius:999px; font-size:.76rem; font-weight:700; margin-top:16px;
}
.pix-card{

<script>
/* ==================== FIREBASE ==================== */
const firebaseConfig = {

/* ==================== ESTADO ====================
   Passos: 1=Cardápio 2=Carrinho 3=Nome+Telefone 4=Pagamento 5=Confirmação */
const state = {
  nome: '', telefone: '', pay: 'Dinheiro',
  cart: [], step: 1, cat: null, search: '',
  tipoEntrega: 'retirada', bairro: '', rua: '', complemento: '', entregaLoc: null, numeroPedido: null, ultimaTaxa: 0,
  precisaTroco: null, trocoPara: null, pedidoClienteId: null
};
const data = { avulsos: [], promocoes: [], config: { tamanhos: [], chavePix: '', lojaLocalizacao: null, faixasEntrega: [], telefoneLoja: '', categorias: [], taxaZeroAtiva: false }, saudacao: null };
const LS_NOME = 'diskDourado_nome', LS_TEL = 'diskDourado_telefone';

function brl(v) { return (v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }

function calcDistKm(lat1, lon1, lat2, lon2) {
  const toRad = v => v * Math.PI / 180;
  const R = 6371;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function calcTaxa(km) {
  if (data.config.taxaZeroAtiva) return 0;
  const faixas = (data.config.faixasEntrega || []).slice().sort((a, b) => a.ateKm - b.ateKm);
  const faixa = faixas.find(f => km <= f.ateKm);
  const valor = faixa ? faixa.preco : (faixas.length ? faixas[faixas.length - 1].preco : 0);
  const minima = data.config.taxaMinima || 0;
  return Math.max(valor, minima);
}
function toast(msg) { alert(msg); }

// Geocodificação reversa gratuita (OpenStreetMap Nominatim) — preenche bairro/rua
// automaticamente a partir da localização. Sem chave de API, mas pode falhar ou
// vir incompleto em regiões com pouco mapeamento — por isso os campos continuam editáveis.
async function preencherEnderecoAutomatico(lat, lng) {
  try {
    const resp = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`);
    const data2 = await resp.json();
    const addr = data2.address || {};
    state.rua = addr.road || addr.pedestrian || state.rua;
    state.bairro = addr.suburb || addr.neighbourhood || addr.village || addr.city_district || state.bairro;
  } catch (e) {
    // Falha silenciosa — a pessoa preenche manualmente se precisar
  }
}

/* ==================== RIPPLE (efeito de toque) ==================== */
document.addEventListener('click', (e) => {
  const target = e.target.closest('.ripple');
  if (!target) return;
  const rect = target.getBoundingClientRect();
  const fx = document.createElement('span');
  const size = Math.max(rect.width, rect.height);
  fx.className = 'ripple-fx';
  fx.style.width = fx.style.height = size + 'px';
  fx.style.left = (e.clientX - rect.left - size / 2) + 'px';
  fx.style.top = (e.clientY - rect.top - size / 2) + 'px';
  target.appendChild(fx);
  setTimeout(() => fx.remove(), 550);
});

/* ==================== CARREGAR DADOS ==================== */
Promise.all([
  fdb.ref('produtos').once('value'),
  fdb.ref('config/geral').once('value'),
  fdb.ref('promocoes').once('value')
]).then(([produtosSnap, configSnap, promocoesSnap]) => {
  const produtosVal = produtosSnap.val() || {};
  // Mesmo catálogo do Caixa — só mostra aqui o que a loja marcou como "Mostrar no app do cliente"
  data.avulsos = Object.keys(produtosVal)
    .filter(key => produtosVal[key].mostrarNoApp === true)
    .map(key => {
      const p = produtosVal[key];
      return {
        id: key, nome: p.name, preco: p.price, foto: p.image || '', categoria: p.categoria || '',
        estoque: p.stock ?? 0, ordem: p.ordem ?? 0, destaque: p.destaque || '',
        origem: 'produto', stockPath: 'produtos/' + key + '/stock'
      };
    });
  const promocoesVal = promocoesSnap.val() || {};
  // Itens de promoção criados na hora (não existem como produto no Caixa, ex: "Frango + Coca")
  data.promocoes = Object.keys(promocoesVal)
    .map(key => {
      const p = promocoesVal[key];
      return {
        id: key, nome: p.nome, preco: p.preco, foto: p.foto || '', descricao: p.descricao || '',
        estoque: p.estoque ?? 0, grupo: p.grupo || '', ativo: p.ativo === true,
        origem: 'promocao', stockPath: 'promocoes/' + key + '/estoque'
      };
    });
  if (configSnap.exists()) data.config = { ...data.config, ...configSnap.val() };
  if (!data.config.tamanhos || !data.config.tamanhos.length) {
    data.config.tamanhos = [{ key:'300ml', label:'300ml', preco:15 }, { key:'500ml', label:'500ml', preco:20 }, { key:'700ml', label:'700ml', preco:25 }];
  }
  if (!data.config.categorias || !data.config.categorias.length) {
    data.config.categorias = [...new Set(data.avulsos.map(a => a.categoria).filter(Boolean))];
  }
  if (!state.cat) state.cat = data.config.categorias[0] || 'produtos';
  render();
  retomarTrackerSeExistir();
  carregarSaudacaoPersonalizada();
}).catch(err => {
  document.getElementById('app').innerHTML = `<div class="loading">⚠️ Não foi possível carregar o cardápio agora.<br><small>${err.message}</small></div>`;
});

/* ==================== ACOMPANHAMENTO DO PEDIDO (tipo iFood) ==================== */
const TRACKER_KEY = 'bs_pedido_ativo';
const TRACKER_TIMEOUT_MS = 20 * 60 * 1000; // 20 minutos após concluir, o botão some sozinho

let taxaZeroCollapsed = false;
let taxaZeroTimerStarted = false;
let ultimoPedidoExpandido = false;

let trackerUnsub1 = null;
let trackerInfo = null; // { pedidoClienteId, numeroPedido, nome, criadoEm, tipoEntrega, pedidoExists, prontoCozinha, statusEntrega, pago, concluidoEm }
let trackerPanelOpen = false;
let trackerTickInterval = null;
let ultimaEtapaRenderizada = null;
let ultimoPainelAbertoRenderizado = null;

function salvarPedidoAtivo(pedidoClienteId, numeroPedido, nome, criadoEm, tipoEntrega) {
  localStorage.setItem(TRACKER_KEY, JSON.stringify({ pedidoClienteId, numeroPedido, nome, criadoEm, tipoEntrega, concluidoEm: null }));
}
function atualizarPedidoAtivoLocal(patch) {
  const atual = JSON.parse(localStorage.getItem(TRACKER_KEY) || 'null');
  if (!atual) return;
  localStorage.setItem(TRACKER_KEY, JSON.stringify({ ...atual, ...patch }));
}
function limparPedidoAtivo() {
  localStorage.removeItem(TRACKER_KEY);
  trackerInfo = null; trackerPanelOpen = false;
  ultimaEtapaRenderizada = null; ultimoPainelAbertoRenderizado = null;
  if (trackerUnsub1) trackerUnsub1();
  if (trackerTickInterval) clearInterval(trackerTickInterval);
  renderTrackerUI(true);
}
function retomarTrackerSeExistir() {
  const salvo = JSON.parse(localStorage.getItem(TRACKER_KEY) || 'null');
  if (!salvo) return;
  if (salvo.concluidoEm && (Date.now() - new Date(salvo.concluidoEm).getTime()) > TRACKER_TIMEOUT_MS) {
    limparPedidoAtivo();
    return;
  }
  trackerInfo = { ...salvo, pedidoExists: true };
  iniciarTrackerListener(salvo.pedidoClienteId, salvo.numeroPedido);
}

function iniciarTrackerListener(pedidoClienteId, numeroPedido) {
  if (trackerUnsub1) trackerUnsub1();
  if (!trackerInfo) trackerInfo = { pedidoClienteId, numeroPedido, concluidoEm: null };
  const ref = fdb.ref('pedidosCliente/' + pedidoClienteId);
  const handler = (snap) => {
    if (snap.exists()) {
      const d = snap.val();
      trackerInfo.pedidoExists = true;
      trackerInfo.criadoEm = d.criadoEm;
      trackerInfo.nome = d.nome;
      trackerInfo.tipoEntrega = d.tipoEntrega;
      trackerInfo.pago = d.pago === true;
      // "Pronto" da cozinha e status de entrega são atualizados diretamente no
      // próprio pedidosCliente pela aba Comanda do PDV — fonte única de verdade.
      trackerInfo.prontoCozinha = d.prontoCozinha === true;
      trackerInfo.statusEntrega = d.statusEntrega || null;
      const concluido = d.tipoEntrega === 'entrega' ? d.statusEntrega === 'entregue' : d.prontoCozinha === true;
      if (concluido && !trackerInfo.concluidoEm) {
        trackerInfo.concluidoEm = new Date().toISOString();
        atualizarPedidoAtivoLocal({ concluidoEm: trackerInfo.concluidoEm });
        const pedidoAlvo = trackerInfo.pedidoClienteId;
        setTimeout(() => {
          // só limpa se ainda for o MESMO pedido — evita apagar um pedido novo
          // que a pessoa tenha feito antes desses 20 minutos passarem
          if (trackerInfo && trackerInfo.pedidoClienteId === pedidoAlvo) limparPedidoAtivo();
        }, TRACKER_TIMEOUT_MS);
      }
    } else {
      trackerInfo.pedidoExists = false;
    }
    renderTrackerUI();
    garantirTick();
  };
  ref.on('value', handler, () => {});
  trackerUnsub1 = () => ref.off('value', handler);
}

function garantirTick() {
  if (trackerTickInterval) return;
  trackerTickInterval = setInterval(() => {
    if (!trackerInfo) { clearInterval(trackerTickInterval); trackerTickInterval = null; return; }
    renderTrackerUI();
    if (calcularEtapaTracker() >= 2) { clearInterval(trackerTickInterval); trackerTickInterval = null; }
  }, 1000);
}

// Retorna a etapa atual: 0=Enviado 1=Aceito(simulado) 2=Em preparo 3=Pronto/Saiu 4=Entregue
function calcularEtapaTracker() {
  if (!trackerInfo) return 0;
  const elapsedOk = trackerInfo.criadoEm && (Date.now() - new Date(trackerInfo.criadoEm).getTime()) > 5000;
  let etapa = elapsedOk ? 1 : 0;

  // "Pronto" da cozinha e status de entrega vêm direto do pedidosCliente (RTDB),
  // atualizado pela aba Comanda do PDV.
  const prontoCozinha = trackerInfo.prontoCozinha;
  const statusEntrega = trackerInfo.statusEntrega;
  const tipoEntrega = trackerInfo.tipoEntrega;

  if (prontoCozinha) etapa = (tipoEntrega === 'entrega') ? 2 : 3;
  if (tipoEntrega === 'entrega') {
    if (statusEntrega === 'em_rota') etapa = 3;
    if (statusEntrega === 'entregue') etapa = 4;
  }
  return etapa;
}

function renderTrackerUI(forcar) {
  if (!trackerInfo) {
    const existing = document.getElementById('trackerRoot');
    if (existing) existing.remove();
    ultimaEtapaRenderizada = null; ultimoPainelAbertoRenderizado = null;
    return;
  }

  const etapa = calcularEtapaTracker();
  const jaExiste = !!document.getElementById('trackerRoot');
  if (!forcar && jaExiste && etapa === ultimaEtapaRenderizada && trackerPanelOpen === ultimoPainelAbertoRenderizado) {
    return; // nada mudou de verdade — evita redesenhar e "piscar" a tela à toa
  }
  ultimaEtapaRenderizada = etapa;
  ultimoPainelAbertoRenderizado = trackerPanelOpen;

  const existing = document.getElementById('trackerRoot');
  if (existing) existing.remove();

  const isEntrega = trackerInfo.tipoEntrega === 'entrega';
  const passos = isEntrega
    ? ['Enviado', 'Aceito', 'Em preparo', 'Saiu pra entrega', 'Entregue']
    : ['Enviado', 'Aceito', 'Em preparo', 'Pronto para retirar'];
  const maxEtapa = passos.length - 1;
  const etapaClamp = Math.min(etapa, maxEtapa);

  const root = document.createElement('div');
  root.id = 'trackerRoot';
  root.innerHTML = `
    <button class="tracker-fab ripple" id="trackerFabBtn"><span class="tracker-emoji">🛵</span>${etapaClamp < maxEtapa ? '<span class="tracker-dot"></span>' : ''}</button>
    ${trackerPanelOpen ? `
      <div class="tracker-panel anim-in">
        <div class="tracker-panel-head">
          <div>
            <div class="tracker-title">Pedido #${trackerInfo.numeroPedido}</div>
            <div class="tracker-sub">${trackerInfo.nome || ''}</div>
          </div>
          <button class="tracker-close" id="trackerCloseBtn">✕</button>
        </div>
        <div class="tracker-steps">
          ${passos.map((p, i) => `
            <div class="tracker-step ${i <= etapaClamp ? 'done' : ''} ${i === etapaClamp ? 'current' : ''}">
              <div class="tracker-step-dot">${i <= etapaClamp ? '✓' : ''}</div>
              <div class="tracker-step-label">${p}</div>
            </div>`).join('')}
        </div>
        ${etapaClamp < maxEtapa ? '<div class="tracker-loading"><span class="spin"></span> Atualizando...</div>' : '<div class="tracker-done-msg">🎉 Pedido concluído!</div>'}
      </div>` : ''}`;
  document.body.appendChild(root);

  document.getElementById('trackerFabBtn').addEventListener('click', () => {
    trackerPanelOpen = !trackerPanelOpen;
    renderTrackerUI();
  });
  const closeBtn = document.getElementById('trackerCloseBtn');
  if (closeBtn) closeBtn.addEventListener('click', () => { trackerPanelOpen = false; renderTrackerUI(); });
}

/* ==================== MÁSCARA DE TELEFONE ==================== */
function maskPhone(value) {
  let d = value.replace(/\D/g, '').slice(0, 11);
  let out = '';
  if (d.length > 0) out += '(' + d.slice(0, 2);
  if (d.length >= 2) out += ')' + d.slice(2, 3);
  if (d.length >= 3) out += '.' + d.slice(3, 7);
  if (d.length >= 7) out += '-' + d.slice(7, 11);
  return out;
}

/* ==================== HELPERS DE CARRINHO ==================== */
function emojiOrPhoto(item, cls) {
  if (item.foto) return `<img src="${item.foto}">`;
  const emojis = (item.emojis && item.emojis.length) ? item.emojis.join('') : '🥣';
  return emojis;
}

function bumpCartBar() {
  const bar = document.getElementById('cartBar');
  if (!bar) return;
  bar.classList.remove('bump');
  void bar.offsetWidth; // força reflow pra poder re-disparar a animação
  bar.classList.add('bump');
}

// Funciona tanto pra produto real (origem:'produto') quanto item de promoção
// criado na hora (origem:'promocao') — os dois têm o mesmo formato: id, nome,
// preco, foto, estoque, stockPath.
function addToCart(a, obs) {
  obs = obs || '';
  const tipoLinha = 'item-' + a.origem;
  const existing = state.cart.find(c => c.refId === a.id && c.tipo === tipoLinha && (c.obs || '') === obs);
  const qtdTotalAtual = state.cart.filter(c => c.refId === a.id && c.tipo === tipoLinha).reduce((s, c) => s + c.qtd, 0);
  if (qtdTotalAtual >= (a.estoque ?? 0)) { return; } // sem estoque suficiente — botão já fica desabilitado, isso é só uma trava extra
  if (existing) existing.qtd++;
  else state.cart.push({
    refId: a.id, tipo: tipoLinha, nome: a.nome, preco: a.preco, foto: a.foto || '', qtd: 1, obs, stockPath: a.stockPath
  });
  render();
  bumpCartBar();
}
// mantido por compatibilidade com o nome antigo
function addAvulso(a, obs) { addToCart(a, obs); }

function cartTotal() { return state.cart.reduce((s, i) => s + i.preco * i.qtd, 0); }
function cartCount() { return state.cart.reduce((s, i) => s + i.qtd, 0); }
function incCartQty(idx){
  const item = state.cart[idx];
  const fonte = item.tipo === 'item-promocao' ? data.promocoes : data.avulsos;
  const produto = fonte.find(a => a.id === item.refId);
  const max = produto ? (produto.estoque ?? 0) : 999;
  const totalOutrasLinhas = state.cart.reduce((s, c, i) => i !== idx && c.refId === item.refId && c.tipo === item.tipo ? s + c.qtd : s, 0);
  if (item.qtd + totalOutrasLinhas >= max) return;
  item.qtd++; render();
}
function decCartQty(idx){ state.cart[idx].qtd--; if (state.cart[idx].qtd <= 0) state.cart.splice(idx,1); render(); }

/* ==================== SAUDAÇÃO PERSONALIZADA ==================== */
async function carregarSaudacaoPersonalizada() {
  let nome, telefone;
  try { nome = localStorage.getItem(LS_NOME); telefone = localStorage.getItem(LS_TEL); } catch (e) { return; }
  if (!nome || !telefone) return;
  try {
    const snap = await fdb.ref('pedidosCliente').orderByChild('telefone').equalTo(telefone).limitToLast(1).once('value');
    const val = snap.val();
    if (!val) return;
    const ultimoPedido = Object.values(val)[0];
    if (!ultimoPedido || !ultimoPedido.itens || !ultimoPedido.itens.length) return;
    // só nomes únicos, na ordem em que apareceram
    const nomesUnicos = [...new Map(ultimoPedido.itens.map(i => [i.nome, i])).values()];
    data.saudacao = { nome: nome.split(' ')[0], itens: nomesUnicos };
    render();
  } catch (e) { /* sem index no banco ou sem conexão — sem problema, só não mostra a saudação */ }
}

function pedirNovamente() {
  if (!data.saudacao) return;
  data.saudacao.itens.forEach(item => {
    const produtoAtual = data.avulsos.find(a => a.nome === item.nome) || data.promocoes.find(p => p.nome === item.nome);
    if (produtoAtual && (produtoAtual.estoque ?? 0) > 0) addToCart(produtoAtual);
  });
}

/* ==================== DESTAQUES ==================== */
const DESTAQUE_LABELS = {
  mais_vendidos: '🔥 Mais vendidos',
  promocao: '❤️ Promoções',
  combo: '🥤 Combos',
  frango_domingo: '🍗 Frango do domingo'
};
function renderDestaquesSection() {
  const grupos = Object.keys(DESTAQUE_LABELS)
    .map(key => {
      const doCatalogo = data.avulsos.filter(a => a.destaque === key);
      const criados = data.promocoes.filter(p => p.grupo === key && p.ativo);
      return { key, label: DESTAQUE_LABELS[key], itens: [...doCatalogo, ...criados] };
    })
    .filter(g => g.itens.length);
  if (!grupos.length) return '';
  return `<div class="destaques-wrap anim-in" id="destaquesWrap" style="animation-delay:.09s">
    ${grupos.map(g => `
      <div class="destaque-group">
        <div class="destaque-title">${g.label}</div>
        <div class="destaque-row">
          ${g.itens.map(a => {
            const qtdNoCarrinho = state.cart.filter(c => c.refId === a.id && c.tipo === 'item-' + a.origem).reduce((s, c) => s + c.qtd, 0);
            const semEstoque = (a.estoque ?? 0) <= qtdNoCarrinho;
            return `
            <div class="destaque-card ${semEstoque ? 'sem-estoque' : ''}" data-id="${a.id}" data-origem="${a.origem}">
              <div class="destaque-media">${a.foto ? `<img src="${a.foto}">` : emojiOrPhoto(a)}</div>
              <div class="destaque-nome">${a.nome}</div>
              <div class="destaque-preco">${brl(a.preco)}</div>
            </div>`;
          }).join('')}
        </div>
      </div>`).join('')}
  </div>`;
}

/* ==================== PROGRESSO ==================== */
const STEP_LABELS = { 2:'Carrinho', 3:'Entrega', 4:'Seus dados', 5:'Pagamento', 6:'Pronto' };
function progressBar() {
  const pct = Math.min(100, Math.max(0, ((state.step - 1) / 5) * 100));
  return `<div class="progress-shell">
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label"><span>Passo ${state.step} de 6</span><span>${STEP_LABELS[state.step] || ''}</span></div>
  </div>`;
}

/* ==================== RENDERIZAÇÃO ==================== */
function render() {
  const el = document.getElementById('app');

  if (state.step === 1) {
    // dispara (uma única vez) o timer que encolhe o aviso de taxa zero pro cabeçalho
    if (data.config.taxaZeroAtiva && !taxaZeroTimerStarted) {
      taxaZeroTimerStarted = true;
      setTimeout(() => { taxaZeroCollapsed = true; render(); }, 3800);
    }
    el.innerHTML = `
      <div class="topbar anim-in">
        <div class="topbar-left">
          <img class="logo" src="logo-small.png" onerror="this.style.display='none'">
          <div class="id"><h1>Disk Dourado</h1><p>Bebidas🍻</p></div>
        </div>
        ${data.config.taxaZeroAtiva && taxaZeroCollapsed ? `<div class="taxa-zero-badge anim-in">🛵 Entrega grátis hoje</div>` : ''}
      </div>
      ${data.config.taxaZeroAtiva && !taxaZeroCollapsed ? `
      <div class="promo-banner anim-in" style="animation-delay:.02s">
        <div class="ico">🛵</div>
        <div class="txt"><strong>Taxa de entrega ZERO hoje</strong><span>Aproveite enquanto a promoção está ativa</span></div>
      </div>` : ''}
      <div class="search-bar-sticky">
        <div class="search-bar anim-in" style="animation-delay:.03s">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#A9946A" stroke-width="2"/><path d="M21 21L16.5 16.5" stroke="#A9946A" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="searchInput" placeholder="Buscar no cardápio..." value="${state.search}">
        </div>
      </div>
      ${data.saudacao ? `
      <div class="greeting-card anim-in" style="animation-delay:.04s">
        <div class="greeting-hello">Olá, ${data.saudacao.nome}! 👋</div>
        <div class="greeting-sub">O que vai pedir hoje?</div>
        <div class="last-order-toggle" id="lastOrderToggle">
          <span>🔁 Último pedido</span>
          <span class="chevron ${ultimoPedidoExpandido ? 'open' : ''}">▾</span>
        </div>
        ${ultimoPedidoExpandido ? `
        <div class="greeting-chips">
          ${data.saudacao.itens.map(i => `<span class="greeting-chip">${i.nome}</span>`).join('')}
        </div>
        <button class="greeting-btn ripple" id="btnPedirNovamente">Pedir novamente</button>` : ''}
      </div>` : ''}
      ${renderDestaquesSection()}
      <div class="cat-row anim-in" id="catRow" style="animation-delay:.1s">
        ${(data.config.categorias || []).map(c => `<button class="cat-pill ripple ${state.cat === c ? 'active' : ''}" data-cat="${c}">${c}</button>`).join('')}
      </div>
      <div id="menuArea"></div>
      <div class="cart-bar ripple ${state.cart.length ? '' : 'disabled'}" id="cartBar">
        <span class="left">🛒 <span class="count-dot">${cartCount()}</span> ${cartCount() === 1 ? 'item' : 'itens'}</span>
        <span class="sep">•</span>
        <span>${brl(cartTotal())}</span>
      </div>
      <div class="pd-overlay" id="pdOverlay"></div>`;
    document.getElementById('catRow').addEventListener('click', e => {
      const btn = e.target.closest('.cat-pill'); if (!btn) return;
      state.cat = btn.dataset.cat; render();
    });
    document.getElementById('cartBar').addEventListener('click', () => { if (state.cart.length) { state.step = 2; render(); } });
    document.getElementById('searchInput').addEventListener('input', (e) => { state.search = e.target.value; onSearchInput(); });
    const btnPedirNovamente = document.getElementById('btnPedirNovamente');
    if (btnPedirNovamente) btnPedirNovamente.addEventListener('click', pedirNovamente);
    const lastOrderToggle = document.getElementById('lastOrderToggle');
    if (lastOrderToggle) lastOrderToggle.addEventListener('click', () => { ultimoPedidoExpandido = !ultimoPedidoExpandido; render(); });
    const destaquesWrap = document.getElementById('destaquesWrap');
    if (destaquesWrap) destaquesWrap.addEventListener('click', e => {
      const card = e.target.closest('.destaque-card'); if (!card) return;
      const fonte = card.dataset.origem === 'promocao' ? data.promocoes : data.avulsos;
      const item = fonte.find(a => a.id === card.dataset.id);
      if (item) openProductDetail(item);
    });
    renderMenuArea();
    return;
  }

  if (state.step === 2) {
    el.innerHTML = `
      <div class="back-link ripple" id="backToMenu">← Voltar ao cardápio</div>
      ${progressBar()}
      <div class="glass-card anim-in">
        <div class="step-title">Seu carrinho</div>
        <div class="step-sub">Confira os itens antes de continuar.</div>
        <div id="cartList"></div>
        <div class="total-row"><span>Total</span><span class="amt">${brl(cartTotal())}</span></div>
        <button class="btn-primary ripple" id="btnContinuar2">Continuar →</button>
      </div>`;
    document.getElementById('backToMenu').addEventListener('click', () => { state.step = 1; render(); });
    document.getElementById('btnContinuar2').addEventListener('click', () => { state.step = 3; render(); });
    const cartList = document.getElementById('cartList');
    if (!state.cart.length) cartList.innerHTML = '<div class="empty-note">🛒 Carrinho vazio.</div>';
    state.cart.forEach((item, idx) => {
      const row = document.createElement('div');
      row.className = 'cart-item';
      row.style.animationDelay = (idx * 0.05) + 's';
      row.innerHTML = `
        <div class="cart-item-media">${item.foto ? `<img src="${item.foto}">` : '<span>🍺</span>'}</div>
        <div class="info">
          <div class="nome">${item.nome}</div>
          <div class="unit">${brl(item.preco)} cada${item.obs ? ` · "${item.obs}"` : ''}</div>
        </div>
        <div class="right">
          <div class="preco">${brl(item.preco * item.qtd)}</div>
          <div class="qty-stepper">
            <button class="danger" data-dec="${idx}">${item.qtd === 1 ? '✕' : '−'}</button>
            <span>${item.qtd}</span>
            <button data-inc="${idx}">+</button>
          </div>
        </div>`;
      cartList.appendChild(row);
    });
    cartList.querySelectorAll('[data-inc]').forEach(b => b.addEventListener('click', () => incCartQty(parseInt(b.dataset.inc))));
    cartList.querySelectorAll('[data-dec]').forEach(b => b.addEventListener('click', () => decCartQty(parseInt(b.dataset.dec))));
    return;
  }

  if (state.step === 3) {
    const loja = data.config.lojaLocalizacao;
    const locSemLoja = state.tipoEntrega === 'entrega' && state.entregaLoc && !loja;
    const km = state.entregaLoc && loja ? calcDistKm(loja.lat, loja.lng, state.entregaLoc.lat, state.entregaLoc.lng) : null;
    const taxa = km !== null ? calcTaxa(km) : 0;
    const podeContinuar = state.tipoEntrega === 'retirada' || (state.entregaLoc && loja);
    el.innerHTML = `
      <div class="back-link ripple" id="backToCart2">← Voltar ao carrinho</div>
      ${progressBar()}
      <div class="glass-card anim-in">
        <div class="step-title">Como você vai receber?</div>
        <div class="step-sub">Escolha retirada no balcão ou entrega no endereço.</div>
        <div class="tipo-entrega-row" id="tipoEntregaRow">
          <div class="tipo-entrega-card ${state.tipoEntrega==='retirada'?'active':''}" data-tipo="retirada"><span class="ico">🏠</span><span>Retirada</span></div>
          <div class="tipo-entrega-card ${state.tipoEntrega==='entrega'?'active':''}" data-tipo="entrega"><span class="ico">🛵</span><span>Entrega</span></div>
        </div>
        ${state.tipoEntrega === 'entrega' ? `
          <button class="btn-primary ripple" id="locBtn" style="margin-bottom:14px;">
            ${state.entregaLoc ? '✅ Localização capturada' : '📍 Usar minha localização'}
          </button>
          <div class="field-label">Bairro</div>
          <input class="pill-input" id="bairroInput" placeholder="Seu bairro" value="${state.bairro}">
          <div class="field-label">Rua</div>
          <input class="pill-input" id="ruaInput" placeholder="Sua rua" value="${state.rua}">
          <div class="field-label">Quadra / Lote / Número da casa</div>
          <input class="pill-input" id="complementoInput" placeholder="Digite aqui (não preenche sozinho)" value="${state.complemento}">
          ${locSemLoja ? `
            <div class="dist-card" style="border:1px solid var(--danger);">
              <div class="dist-row" style="color:#ffb0b0;">⚠️ Não conseguimos calcular a taxa de entrega agora. Fale com a loja antes de continuar.</div>
            </div>` : ''}
          ${km !== null ? `
            <div class="dist-card">
              <div class="dist-row"><span>Distância até a loja</span><b>${km.toFixed(1)} km</b></div>
              <div class="dist-row"><span>Taxa de entrega</span><b>${brl(taxa)}</b></div>
            </div>` : ''}
        ` : ''}
        <div class="total-row"><span>Total</span><span class="amt">${brl(cartTotal() + (state.tipoEntrega==='entrega' ? taxa : 0))}</span></div>
        <button class="btn-primary ripple" id="btnContinuar3b" ${!podeContinuar ? 'disabled' : ''}>Continuar →</button>
      </div>`;
    document.getElementById('backToCart2').addEventListener('click', () => { state.step = 2; render(); });
    document.getElementById('tipoEntregaRow').addEventListener('click', e => {
      const c = e.target.closest('.tipo-entrega-card'); if (!c) return;
      state.tipoEntrega = c.dataset.tipo; render();
    });
    const locBtn = document.getElementById('locBtn');
    if (locBtn) locBtn.addEventListener('click', () => {
      locBtn.innerHTML = '<span class="spin"></span> Localizando...';
      if (!navigator.geolocation) { toast('Seu navegador não suporta localização.'); render(); return; }
      navigator.geolocation.getCurrentPosition(
        async pos => {
          state.entregaLoc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          await preencherEnderecoAutomatico(state.entregaLoc.lat, state.entregaLoc.lng);
          render();
        },
        () => { toast('Não foi possível obter sua localização.'); render(); },
        { timeout: 8000 }
      );
    });
    const bairroInput = document.getElementById('bairroInput');
    const ruaInput = document.getElementById('ruaInput');
    const complementoInput = document.getElementById('complementoInput');
    if (bairroInput) bairroInput.addEventListener('input', e => { state.bairro = e.target.value; });
    if (ruaInput) ruaInput.addEventListener('input', e => { state.rua = e.target.value; });
    if (complementoInput) complementoInput.addEventListener('input', e => { state.complemento = e.target.value; });
    document.getElementById('btnContinuar3b').addEventListener('click', () => { state.step = 4; render(); });
    return;
  }

  if (state.step === 4) {
    el.innerHTML = `
      <div class="back-link ripple" id="backToEntrega">← Voltar</div>
      ${progressBar()}
      <div class="glass-card anim-in">
        <div class="step-title">Quase lá!</div>
        <div class="step-sub">Precisamos do seu nome e telefone.</div>
        <div class="field-label">Seu nome</div>
        <input class="pill-input" id="nomeInput" placeholder="Digite seu nome" value="${state.nome}">
        <div class="field-label">Seu telefone</div>
        <input class="pill-input" id="telInput" type="tel" inputmode="numeric" placeholder="(00)0.0000-0000" value="${state.telefone}">
        <div class="hint">Só números</div>
        <button class="btn-primary ripple" id="btnContinuar4" disabled>Continuar →</button>
      </div>`;
    document.getElementById('backToEntrega').addEventListener('click', () => { state.step = 3; render(); });
    const nomeInput = document.getElementById('nomeInput');
    const telInput = document.getElementById('telInput');
    const btn4 = document.getElementById('btnContinuar4');
    function checkValid4() {
      const nomeOk = nomeInput.value.trim().length > 0;
      const telOk = telInput.value.replace(/\D/g, '').length >= 10;
      btn4.disabled = !(nomeOk && telOk);
    }
    telInput.addEventListener('input', (e) => { e.target.value = maskPhone(e.target.value); checkValid4(); });
    nomeInput.addEventListener('input', checkValid4);
    checkValid4();
    btn4.addEventListener('click', () => {
      state.nome = nomeInput.value.trim();
      state.telefone = telInput.value.trim();
      state.step = 5; render();
    });
    return;
  }

  if (state.step === 5) {
    const loja = data.config.lojaLocalizacao;
    const km = state.entregaLoc && loja ? calcDistKm(loja.lat, loja.lng, state.entregaLoc.lat, state.entregaLoc.lng) : null;
    const taxa = km !== null ? calcTaxa(km) : 0;
    const totalComTaxa = cartTotal() + (state.tipoEntrega==='entrega' ? taxa : 0);
    const precisaRespostaTroco = state.pay === 'Dinheiro' && state.precisaTroco === null;
    const precisaValorTroco = state.pay === 'Dinheiro' && state.precisaTroco === true && !state.trocoPara;
    const podeFinalizar = !precisaRespostaTroco && !precisaValorTroco;
    el.innerHTML = `
      <div class="back-link ripple" id="backToTel">← Voltar</div>
      ${progressBar()}
      <div class="glass-card anim-in">
        <div class="step-title">Forma de pagamento</div>
        <div class="step-sub">Como você vai pagar no caixa?</div>
        <div class="pay-row" id="payRow">
          <button class="pay-chip ripple ${state.pay==='Dinheiro'?'active':''}" data-pay="Dinheiro"><span class="ico">💵</span>Dinheiro</button>
          <button class="pay-chip ripple ${state.pay==='Pix'?'active':''}" data-pay="Pix"><span class="ico">📱</span>Pix</button>
          <button class="pay-chip ripple ${state.pay==='Cartão'?'active':''}" data-pay="Cartão"><span class="ico">💳</span>Cartão</button>
        </div>
        ${state.pay === 'Dinheiro' ? `
          <div class="field-label">Precisa de troco?</div>
          <div class="tipo-entrega-row" id="trocoRow" style="margin-bottom:14px;">
            <div class="tipo-entrega-card ${state.precisaTroco===true?'active':''}" data-troco="sim"><span class="ico">💵</span><span>Sim</span></div>
            <div class="tipo-entrega-card ${state.precisaTroco===false?'active':''}" data-troco="nao"><span class="ico">🙅</span><span>Não precisa</span></div>
          </div>
          ${state.precisaTroco === true ? `
            <div class="field-label">Troco para quanto?</div>
            <input class="pill-input" id="trocoInput" type="number" inputmode="decimal" placeholder="Ex: 50 ou 100" value="${state.trocoPara || ''}">
          ` : ''}
        ` : ''}
        ${state.tipoEntrega==='entrega' ? `<div class="total-row" style="border:none; padding-top:0; margin-bottom:0;"><span>Taxa de entrega</span><span class="amt">${brl(taxa)}</span></div>` : ''}
        <div class="total-row"><span>Total do pedido</span><span class="amt">${brl(totalComTaxa)}</span></div>
        <button class="btn-primary ripple" id="btnFinalizar" ${!podeFinalizar ? 'disabled' : ''}>✅ Finalizar pedido</button>
      </div>`;
    document.getElementById('backToTel').addEventListener('click', () => { state.step = 4; render(); });
    document.getElementById('payRow').addEventListener('click', e => {
      const btn = e.target.closest('.pay-chip'); if (!btn) return;
      state.pay = btn.dataset.pay;
      if (state.pay !== 'Dinheiro') { state.precisaTroco = null; state.trocoPara = null; }
      render();
    });
    const trocoRow = document.getElementById('trocoRow');
    if (trocoRow) trocoRow.addEventListener('click', e => {
      const c = e.target.closest('.tipo-entrega-card'); if (!c) return;
      state.precisaTroco = c.dataset.troco === 'sim';
      if (!state.precisaTroco) state.trocoPara = null;
      render();
    });
    const trocoInput = document.getElementById('trocoInput');
    if (trocoInput) trocoInput.addEventListener('input', e => {
      state.trocoPara = parseFloat(e.target.value) || null;
      document.getElementById('btnFinalizar').disabled = !state.trocoPara;
    });
    document.getElementById('btnFinalizar').addEventListener('click', finalizarPedido);
    return;
  }

  if (state.step === 6) {
    el.innerHTML = `
      <div class="confirm-wrap anim-in">
        <div class="confirm-icon-wrap"><div class="ring"></div><div class="check">✓</div></div>
        <h2>Pedido enviado!</h2>
        ${state.numeroPedido ? `<div class="status-badge" style="margin-bottom:10px;">Pedido #${state.numeroPedido}</div>` : ''}
        <p>Obrigado, ${state.nome}! Seu pedido de <b style="color:#fff">${brl(cartTotal() + (state.ultimaTaxa || 0))}</b> via <b style="color:#fff">${state.pay}</b> foi enviado pro balcão.</p>
        <div class="status-badge">🥤 Acompanhe pelo botão no canto da tela</div>
        ${state.pay === 'Pix' && data.config.chavePix ? `
          <div class="pix-card">
            <div class="label">CHAVE PIX DA LOJA</div>
            <div class="pix-key" id="pixKeyText">${data.config.chavePix}</div>
            <button class="copy-btn ripple" id="copyPixBtn">Copiar chave</button>
            ${data.config.telefoneLoja ? `<button class="copy-btn ripple" id="enviarComprovanteBtn" style="margin-top:8px; background:#25D366; color:#08380f;">📤 Enviar comprovante</button>` : ''}
          </div>` : ''}
      </div>`;
    const copyBtn = document.getElementById('copyPixBtn');
    if (copyBtn) copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(data.config.chavePix).then(() => { copyBtn.textContent = 'Copiado ✓'; });
    });
    const comprovanteBtn = document.getElementById('enviarComprovanteBtn');
    if (comprovanteBtn) comprovanteBtn.addEventListener('click', () => {
      let digits = (data.config.telefoneLoja || '').replace(/\D/g, '');
      if (digits.length <= 11) digits = '55' + digits;
      const msg = encodeURIComponent(`Olá! Segue o comprovante do meu pedido #${state.numeroPedido || ''} 🍇`);
      window.open(`https://wa.me/${digits}?text=${msg}`, '_blank');
    });
    return;
  }
}

/* ==================== ÁREA DO MENU (categorias) ==================== */
function matchesSearch(nome) {
  if (!state.search.trim()) return true;
  return (nome || '').toLowerCase().includes(state.search.trim().toLowerCase());
}

function onSearchInput() {
  const termo = state.search.trim();
  if (!termo) { renderMenuArea(); return; }
  const temNaCategoriaAtual = data.avulsos.some(a => (a.categoria || '') === state.cat && matchesSearch(a.nome));
  if (!temNaCategoriaAtual) {
    const primeiraComMatch = data.avulsos.find(a => matchesSearch(a.nome));
    if (primeiraComMatch && primeiraComMatch.categoria && primeiraComMatch.categoria !== state.cat) {
      state.cat = primeiraComMatch.categoria;
      render(); // categoria mudou — precisa re-renderizar as pílulas também, não só a lista
      document.getElementById('searchInput')?.focus();
      return;
    }
  }
  renderMenuArea();
}

function renderMenuArea() {
  const area = document.getElementById('menuArea');
  if (!area) return;

  area.innerHTML = '';
  const list = data.avulsos
    .filter(a => (a.categoria || '') === state.cat && matchesSearch(a.nome))
    .sort((a, b) => (a.ordem ?? 0) - (b.ordem ?? 0));
  if (!list.length) { area.innerHTML = `<div class="empty-note">${data.avulsos.length ? '🔍 Nada encontrado nessa categoria.' : 'Nenhum produto disponível no momento.'}</div>`; return; }
  list.forEach((a, i) => {
    const linhasCart = state.cart.filter(c => c.refId === a.id && c.tipo === 'item-produto');
    const qtdNoCarrinho = linhasCart.reduce((s, c) => s + c.qtd, 0);
    const inCart = linhasCart[0];
    const semEstoque = (a.estoque ?? 0) <= qtdNoCarrinho;
    const card = document.createElement('div');
    card.className = 'product-card ripple anim-in' + (semEstoque ? ' sem-estoque' : '');
    card.style.animationDelay = (i * 0.05) + 's';
    card.innerHTML = `
      <div class="media">${a.foto ? `<img src="${a.foto}">` : emojiOrPhoto(a)}
        ${qtdNoCarrinho ? `<span class="qty-float">×${qtdNoCarrinho}</span>` : ''}
      </div>
      <div class="body">
        <div class="nome">${a.nome}</div>
        <div class="desc">${a.descricao || ''}</div>
        <div class="foot"><span class="preco">${brl(a.preco)}</span><button class="add-btn" ${semEstoque ? 'disabled' : ''}>${semEstoque ? 'Esgotado' : 'Adicionar'}</button></div>
      </div>`;
    card.addEventListener('click', (e) => {
      if (e.target.closest('.add-btn')) {
        e.stopPropagation();
        if (!semEstoque) addAvulso(a);
        return;
      }
      openProductDetail(a);
    });
    area.appendChild(card);
  });
}

/* ==================== DETALHE DO PRODUTO ==================== */
function openProductDetail(a) {
  const overlay = document.getElementById('pdOverlay');
  if (!overlay) return;
  const tipoLinha = 'item-' + a.origem;
  const qtdJaNoCarrinho = state.cart.filter(c => c.refId === a.id && c.tipo === tipoLinha).reduce((s, c) => s + c.qtd, 0);
  const semEstoque = (a.estoque ?? 0) <= qtdJaNoCarrinho;
  overlay.innerHTML = `
    <div class="pd-sheet" onclick="event.stopPropagation()">
      <div class="pd-media">
        ${a.foto ? `<img src="${a.foto}">` : emojiOrPhoto(a)}
        <button class="pd-close" id="pdClose">✕</button>
      </div>
      <div class="pd-body">
        <div class="pd-nome">${a.nome}</div>
        <div class="pd-preco">${brl(a.preco)}</div>
        ${a.descricao ? `<div class="pd-desc">${a.descricao}</div>` : ''}
        <div class="pd-field-label">Alguma observação? (opcional)</div>
        <textarea class="pd-obs" id="pdObs" rows="2" placeholder="Ex: sem gelo, bem gelado..." maxlength="140"></textarea>
        <div class="pd-footer">
          <div class="qty-stepper" id="pdQtyStepper">
            <button class="danger" id="pdMinus">−</button>
            <span id="pdQtyVal">1</span>
            <button id="pdPlus">+</button>
          </div>
          <button class="pd-add-btn" id="pdAddBtn" ${semEstoque ? 'disabled' : ''}>${semEstoque ? 'Esgotado' : 'Adicionar ao carrinho'}</button>
        </div>
      </div>
    </div>`;
  overlay.classList.add('open');
  overlay.onclick = closeProductDetail;
  document.getElementById('pdClose').addEventListener('click', closeProductDetail);

  let qty = 1;
  const max = (a.estoque ?? 0) - qtdJaNoCarrinho;
  const qtyEl = document.getElementById('pdQtyVal');
  document.getElementById('pdMinus').addEventListener('click', () => { if (qty > 1) { qty--; qtyEl.textContent = qty; } });
  document.getElementById('pdPlus').addEventListener('click', () => { if (qty < Math.max(max, 1)) { qty++; qtyEl.textContent = qty; } });
  document.getElementById('pdAddBtn').addEventListener('click', () => {
    if (semEstoque) return;
    const obs = document.getElementById('pdObs').value.trim();
    for (let i = 0; i < qty; i++) addToCart(a, obs);
    closeProductDetail();
  });
}

function closeProductDetail() {
  const overlay = document.getElementById('pdOverlay');
  if (overlay) overlay.classList.remove('open');
}

/* ==================== FINALIZAR PEDIDO ==================== */
async function getNextOrderNumber() {
  const ref = fdb.ref('config/geral');
  for (let tentativa = 0; tentativa < 25; tentativa++) {
    const candidato = Math.floor(Math.random() * 900) + 100; // sempre 3 dígitos: 100-999
    try {
      const result = await ref.transaction(atual => {
        const usados = (atual && atual.numerosPedidoUsados) || [];
        if (usados.includes(candidato)) return; // aborta a transação (colisão) — undefined = cancelar
        const novos = usados.length >= 200 ? [...usados.slice(-150), candidato] : [...usados, candidato];
        return { ...(atual || {}), numerosPedidoUsados: novos };
      });
      if (result.committed) return candidato;
      // não fez commit (colisão) — tenta outro número aleatório
    } catch (e) {
      throw e;
    }
  }
  return Math.floor(Math.random() * 900) + 100;
}

async function finalizarPedido() {
  const btn = document.getElementById('btnFinalizar');
  const loja = data.config.lojaLocalizacao;
  const km = state.entregaLoc && loja ? calcDistKm(loja.lat, loja.lng, state.entregaLoc.lat, state.entregaLoc.lng) : null;
  if (state.tipoEntrega === 'entrega' && km === null) {
    alert('Não foi possível calcular a taxa de entrega. Volte e tente marcar a localização novamente, ou escolha retirada.');
    return;
  }
  btn.disabled = true; btn.textContent = 'Enviando...';
  const taxa = km !== null ? calcTaxa(km) : 0;
  state.ultimaTaxa = state.tipoEntrega === 'entrega' ? taxa : 0;
  const endereco = [state.rua, state.bairro, state.complemento].filter(Boolean).join(', ');
  try {
    // Confere e reserva o estoque (do Caixa ou da promoção, via stockPath) antes de mandar o pedido
    const itensComEstoque = state.cart.filter(i => i.stockPath);
    if (itensComEstoque.length) {
      const leituras = await Promise.all(itensComEstoque.map(i => fdb.ref(i.stockPath).once('value')));
      const updates = {};
      for (let idx = 0; idx < itensComEstoque.length; idx++) {
        const item = itensComEstoque[idx];
        const atual = leituras[idx].val() ?? 0;
        if (atual < item.qtd) {
          alert(`Ih, "${item.nome}" acabou de esgotar o estoque. Ajuste a quantidade e tente de novo.`);
          btn.disabled = false; btn.textContent = '✅ Finalizar pedido';
          return;
        }
        updates[item.stockPath] = atual - item.qtd;
      }
      await fdb.ref().update(updates);
    }

    const numero = await getNextOrderNumber();
    state.numeroPedido = numero;
    const pedido = {
      nome: state.nome, telefone: state.telefone, itens: state.cart,
      total: cartTotal() + state.ultimaTaxa, formaPagamento: state.pay,
      status: 'pendente', prontoCozinha: false,
      criadoEm: new Date().toISOString(),
      numeroPedido: numero,
      tipoEntrega: state.tipoEntrega, endereco,
      bairro: state.bairro, rua: state.rua, complemento: state.complemento,
      localizacao: state.entregaLoc, taxaEntrega: state.ultimaTaxa,
      distanciaKm: km,
      precisaTroco: state.precisaTroco || false, trocoPara: state.trocoPara || null
    };
    const docRef = await fdb.ref('pedidosCliente').push(pedido);
    state.pedidoClienteId = docRef.key;
    salvarPedidoAtivo(docRef.key, numero, state.nome, pedido.criadoEm, state.tipoEntrega);
    iniciarTrackerListener(docRef.key, numero);
    try { localStorage.setItem(LS_NOME, state.nome); localStorage.setItem(LS_TEL, state.telefone); } catch (e) {}
    state.step = 6; render();
  } catch (err) {
    alert('Não foi possível enviar o pedido: ' + err.message);
    btn.disabled = false; btn.textContent = '✅ Finalizar pedido';
  }
}
</script>
